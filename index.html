<!DOCTYPE html>
<html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Boodschappen">
<title>Boodschappen</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--g:#2a8f43;--gl:#e3f5e8;--r:#b00000;--b:#3a62b3;--p:#6b32a0;--o:#f5600f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
html,body{margin:0;background:#fff;color:#111;font:700 26px/1.25 'Atkinson Hyperlegible',system-ui,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#app{max-width:1100px;margin:0 auto;padding:16px}
button{font:inherit;touch-action:manipulation;cursor:pointer;border:0;border-radius:18px;color:#fff;padding:16px 20px}
.bar{display:flex;gap:12px;margin-bottom:16px;position:sticky;top:0;background:#fff;z-index:4;padding:8px 0}.bar>*{flex:none}.bar .title{flex:1}
.title{background:#555;color:#fff;border-radius:18px;padding:14px;text-align:center;font-size:32px;display:flex;align-items:center;justify-content:center}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;grid-auto-rows:minmax(100px,min(190px,calc((100vh - 170px)/3)))}
.tile{position:relative;min-height:0;color:#111;border:6px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:26px;line-height:1.1}
.tile.on{border-color:var(--g)}.tile .ic{font-size:50px}
.badge{position:absolute;top:8px;right:8px;background:var(--g);color:#fff;border-radius:99px;min-width:46px;height:46px;line-height:46px;font-size:26px}
.row{display:flex;gap:14px;margin-top:16px}.row button{flex:1;font-size:30px;padding:24px}
.small{display:flex;gap:12px;margin-top:20px;justify-content:center}.small button{background:#999;font-size:20px;padding:10px 16px}
.card{overflow:hidden;display:flex;align-items:center;gap:16px;border:6px solid #d0d0d0;border-radius:18px;margin-bottom:14px;padding:12px 16px;cursor:pointer;touch-action:manipulation}
.card.on{border-color:var(--g);background:var(--gl)}
.pic{width:110px;height:100px;flex:none;display:flex;align-items:center;justify-content:center;font-size:76px}
.pic img{max-width:100%;max-height:110px;display:none;object-fit:contain}
.nm{flex:1;min-width:0;overflow-wrap:anywhere;font-size:28px}
.pill{flex:none;width:260px;text-align:center;padding:14px 12px;border-radius:14px;background:var(--g);color:#fff;font-size:24px;line-height:1.2;overflow-wrap:anywhere}
.card.on .pill{background:#fff;color:var(--g);border:4px solid var(--g)}
.big .bil{width:300px;height:160px;font-size:90px}
.bil{width:110px;height:70px;border-radius:8px;color:#fff;font-size:40px;display:flex;align-items:center;justify-content:center;border:3px solid rgba(0,0,0,.25)}
.cnt{display:flex;align-items:center;gap:12px;font-size:38px}.cnt button{width:76px;font-size:44px;padding:8px}
.big{text-align:center;padding-top:20px}.big .pic{width:auto;height:200px;font-size:150px;margin:0 auto}.big .pic img{max-height:200px}
.big h1{font-size:56px;margin:10px 0 24px}
.two{display:flex;gap:16px}.two button{flex:1;min-height:150px;font-size:34px}
.note{font-size:24px;color:#444;margin:12px 0}
input{width:100%;font:inherit;padding:16px;border:3px solid #123;border-radius:12px;margin:8px 0 12px}
pre{white-space:pre-wrap;font:400 20px/1.3 inherit;background:#f3f3f3;padding:12px;border-radius:12px}
.lay{display:flex;gap:16px;align-items:flex-start}.main{flex:1;min-width:0}
.side{width:260px;flex:none;position:sticky;top:12px;display:flex;flex-direction:column;gap:14px}.side button{font-size:28px;padding:24px 14px;min-height:110px}
@media(orientation:portrait){.grid{grid-template-columns:repeat(3,1fr);grid-auto-rows:minmax(100px,min(200px,calc((100vh - 170px)/4)))}}
@media(max-width:1000px){.lay{display:block}.side{position:fixed;left:0;right:0;bottom:0;width:auto;flex-direction:row;background:#fff;padding:8px 10px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -4px 12px rgba(0,0,0,.25);z-index:5}.side button{flex:1;min-height:80px;font-size:20px;padding:10px}#app{padding-bottom:130px}.card{flex-wrap:wrap}.pill{width:100%}}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div id="app"></div>
<script>
const KEY='21f3ac6a-643b-4131-9be4-2ba11c166ac5';
const slug=n=>n.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
let C=[],R=[];
const parse=t=>{const o=[];t.split(/\r?\n/).forEach(l=>{l=l.trim();if(!l||l[0]=='#')return;const f=l.split('|').map(x=>x.trim());if(l.startsWith('==')){o.push({n:f[0].replace(/^=+\s*/,''),e:f[1]||'📦',c:f[2]||'#dddddd',it:[]})}else if(o.length&&f[0]){o[o.length-1].it.push({n:f[0],e:f[1]||'🛒',col:f[2]||'',id:slug(f[0])})}});return o};
const h=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const S={v:'home',cat:0,sel:{},oma:false,omac:{},extra:[],rd:0,pend:null};
const ls=(k,v)=>{try{return v===undefined?localStorage.getItem(k):localStorage.setItem(k,v)}catch(e){return null}};
try{Object.assign(S,JSON.parse(ls('bo')||'{}'))}catch(e){}S.v='home';
const sv=()=>ls('bo',JSON.stringify({sel:S.sel,oma:S.oma,omac:S.omac,extra:S.extra}));
const hasO=()=>S.oma||Object.keys(S.omac).length>0;
const omaT=()=>{const k=Object.keys(S.omac).map(i=>C[i].n).join(', ');return 'Oma wil nog iets dat niet op het lijstje staat'+(k?' (bij: '+k+')':'')};
const total=()=>Object.values(S.sel).reduce((a,b)=>a+b,0)+S.extra.length+(hasO()?1:0);
const cc=i=>C[i].it.reduce((a,x)=>a+(S.sel[x.id]?1:0),0)+(S.omac[i]?1:0);
const pic=it=>`<div class="pic">${it.col?`<div class="bil" style="background:${it.col}">${it.n.split(' ')[0]}</div>`:`<span>${it.e}</span>`}<img src="img/${it.id}.jpg" alt="" onerror="if(!this.dataset.t){this.dataset.t=1;this.src=this.src.replace('.jpg','.png')}" onload="this.style.display='block';this.previousSibling.style.display='none'"></div>`;
const btn=(a,v,t,bg,x='')=>`<button data-a="${a}" ${v!==undefined?`data-v="${v}"`:''} style="background:${bg};${x}">${t}</button>`;
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='nl-BE';u.rate=.85;const v=speechSynthesis.getVoices();const f=v.find(x=>x.lang.replace('_','-')=='nl-BE')||v.find(x=>x.lang.startsWith('nl'));if(f)u.voice=f;speechSynthesis.speak(u)}catch(e){}}
function card(it){const n=S.sel[it.id]||0;
 if(it.col)return`<div class="card ${n?'on':''}">${pic(it)}<div class="nm">${it.n}</div><div class="cnt">${btn('min',it.id,'−','#888')}<span>${n}×</span>${btn('plus',it.id,'+','var(--g)')}</div></div>`;
 return`<div class="card ${n?'on':''}" data-a="tog" data-v="${it.id}">${pic(it)}<div class="nm">${it.n}</div><div class="pill">${n?'✓ Op de lijst':'Toevoegen aan boodschappenlijst'}</div></div>`}
const toList=()=>btn('go','list',`📋 Naar lijst (${total()})`,'var(--b)','font-size:24px');
function view(){
const fam=(a,t)=>btn(a=='extra'?'go':'go',a,t,'#999','font-size:16px;padding:8px 10px;line-height:1.2');
 if(S.v=='home')return`<div class="bar"><div class="title" style="flex:1">Wat heb je nodig?</div>${btn('read',0,'🔊 Voorlezen','var(--o)','color:#111;font-size:28px')}${fam('extra','➕<br>Zelf toevoegen')}${fam('arch','🗂<br>Vorige lijsten')}</div>
 <div class="grid">${C.map((c,i)=>`<button class="tile ${cc(i)?'on':''}" data-a="cat" data-v="${i}" style="background:${c.c}">${cc(i)?`<span class="badge">${cc(i)}</span>`:''}<span class="ic">${c.e}</span>${c.n}</button>`).join('')}<button class="tile" data-a="go" data-v="list" style="background:var(--b);color:#fff">${total()?`<span class="badge" style="background:#fff;color:var(--b)">${total()}</span>`:''}<span class="ic">📋</span>Naar boodschappenlijst</button></div>`;
 if(S.v=='cat'){const c=C[S.cat],g=S.omac[S.cat];return`<div class="lay"><div class="main"><div class="title" style="background:${c.c};color:#111;margin-bottom:14px">${c.e} ${c.n}</div>${c.it.map(card).join('')}</div><div class="side">${btn('go','home','← Categorieën','var(--r)')}${btn('omc',0,g?'✓ Ik wil nog iets anders':'❓ Ik wil nog iets anders',g?'var(--g)':'var(--p)')}${btn('go','list',`📋 Naar lijst (${total()})`,'var(--b)')}</div></div>`}
 if(S.v=='rintro')return`<div class="bar">${btn('go','home','← Terug','var(--b)')}<div class="title">Voorlezen</div></div><p class="note" style="font-size:30px">De app leest alle artikelen voor, één voor één. Kies bij elk artikel: rood of groen.</p>${btn('rstart',0,'▶ Start','var(--p)','width:100%;font-size:44px;padding:40px')}`;
 if(S.v=='read'){const r=R[S.rd],it=r.it,n=S.sel[it.id]||0;return`<div class="bar">${btn('rstop',0,'■ Stop','#777')}<div class="title" style="background:${C[r.ci].c};color:#111;font-size:26px">${C[r.ci].n} · ${S.rd+1} van ${R.length}</div></div>
 <div class="big">${pic(it)}<h1>${it.n}${it.col&&n?` (${n}× gekozen)`:''}</h1></div>
 <div class="two">${btn('rno',0,it.col?'Geen (meer)':'Ik heb dit niet nodig.','var(--r)')}${btn('ryes',0,it.col?'Toevoegen':(n?'✓ Staat al op de lijst':'Toevoegen aan boodschappenlijst'),'var(--g)')}</div>
 <div class="small">${btn('rrep',0,'🔁 Nog eens zeggen','#999')}</div>`}
 if(S.v=='list'){const rows=[];C.forEach(c=>c.it.forEach(it=>{const n=S.sel[it.id];if(n)rows.push(`<div class="card on">${pic(it)}<div class="nm">${it.n}${it.col?' × '+n:''}</div>${btn('del',it.id,'🗑 Weghalen','var(--b)')}</div>`)}));
  if(hasO())rows.unshift(`<div class="card on"><div class="pic">📞</div><div class="nm">${omaT()}</div>${btn('oma',0,'🗑 Weghalen','var(--b)')}</div>`);
  S.extra.forEach((x,i)=>rows.push(`<div class="card on"><div class="pic">✏️</div><div class="nm">${h(x)}</div>${btn('delx',i,'🗑 Weghalen','var(--b)')}</div>`));
  return`<div class="lay"><div class="main"><div class="title" style="background:var(--b);margin-bottom:14px">Boodschappenlijst</div>${rows.join('')||'<p class="note" style="font-size:30px">De lijst is nog leeg. Ga terug en kies wat je nodig hebt.</p>'}</div>
  <div class="side">${btn('go','home','← Terug naar categorieën','var(--r)')}${btn('omg',0,S.oma?'✓ Ik wil nog iets anders':'❓ Ik wil nog iets anders',S.oma?'var(--g)':'var(--p)')}${rows.length?btn('send',0,'✉ Boodschappenlijst verzenden','var(--b)'):''}</div></div>`}
 if(S.v=='sending')return`<div class="big"><h1>Bezig met verzenden…</h1></div>`;
 if(S.v=='done')return`<div class="big"><div style="font-size:150px;color:var(--b)">✔</div><h1>Het boodschappenlijstje is verstuurd!</h1>${btn('go','home','Terug naar categorieën','var(--b)','font-size:34px;padding:28px 40px')}</div>`;
 if(S.v=='fail')return`<div class="big"><h1>Het versturen is niet gelukt.</h1><p class="note">Controleer of de iPad internet heeft. De lijst staat er nog.</p><div class="two">${btn('go','list','← Terug naar de lijst','var(--r)')}${btn('retry',0,'Opnieuw proberen','var(--g)')}</div></div>`;
 if(S.v=='arch'){const A=JSON.parse(ls('ar')||'[]');return`<div class="bar">${btn('go','home','← Terug','var(--r)')}<div class="title">Vorige lijsten</div></div>${A.map((p,i)=>`<div class="card"><div class="nm">${new Date(p.t).toLocaleString('nl-BE',{weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'})}<pre>${h(p.text)}</pre></div>${btn('resend',i,'✉ Opnieuw versturen','var(--b)')}</div>`).join('')||'<p class="note">Er zijn nog geen lijsten verstuurd.</p>'}`}
 if(S.v=='extra')return`<div class="bar">${btn('go','home','← Categorieën','var(--r)')}<div class="title">Zelf toevoegen</div>${toList()}</div><p class="note">Typ de naam van het artikel en tik op toevoegen.</p><input id="x" autocomplete="off">${btn('addx',0,'Toevoegen aan boodschappenlijst','var(--b)')}
 <p class="note" style="margin-top:40px">Instellingen (alleen familie): webhook-link van Home Assistant</p><input id="ha" value="${h(ls('ha')||'')}" placeholder="https://hooks.nabu.casa/…">${btn('saveha',0,'Opslaan','#777')}`}
let lv='',lc=-1;
function render(){const y=window.scrollY,same=S.v==lv&&S.cat==lc;document.getElementById('app').innerHTML=view();window.scrollTo(0,same?y:0);lv=S.v;lc=S.cat}
function build(){let t=hasO()?omaT()+'. Bel haar even op.\n\n':'';
 for(const i of [...C.keys()].sort((x,y)=>C[y].it.some(q=>q.col)-C[x].it.some(q=>q.col))){const L=C[i].it.filter(x=>S.sel[x.id]);if(L.length)t+=C[i].n.toUpperCase()+'\n'+L.map(x=>'- '+x.n+(x.col?' × '+S.sel[x.id]:'')).join('\n')+'\n\n'}
 if(S.extra.length)t+='EXTRA\n'+S.extra.map(x=>'- '+x).join('\n')+'\n';
 const d=new Date().toLocaleDateString('nl-BE',{weekday:'long',day:'numeric',month:'long'});
 return{t:Date.now(),text:t.trim(),oma:hasO(),subject:`Boodschappenlijst oma, ${d}`,count:total()}}
async function send(p,fresh){S.v='sending';render();let mail=false,ha=false;
 try{const r=await fetch('https://api.web3forms.com/submit',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({access_key:KEY,subject:p.subject,from_name:'Boodschappen oma',message:p.text})});const j=await r.json();mail=r.ok&&j.success}catch(e){}
 const hook=ls('ha');if(hook){try{await fetch(hook,{method:'POST',mode:'no-cors',body:new URLSearchParams({subject:p.subject,text:p.text,oma:p.oma?'1':'0'})});ha=true}catch(e){}}
 if(!mail&&!ha){S.pend=[p,fresh];S.v='fail';return render()}
 if(fresh){const A=JSON.parse(ls('ar')||'[]');A.unshift(p);ls('ar',JSON.stringify(A.slice(0,2)));S.sel={};S.oma=false;S.omac={};S.extra=[];sv()}
 S.v='done';render()}
function step(i){S.rd=i;if(i>=R.length){speechSynthesis.cancel();S.v='list';return render()}S.v='read';render();const r=R[i];say((r.first?C[r.ci].n+'. ':'')+r.it.n)}
function act(a,v){const id=v;
 if(a=='go'){S.v=v;if(v=='home'||v=='list')try{speechSynthesis.cancel()}catch(e){}}
 else if(a=='cat'){S.cat=+v;S.v='cat'}
 else if(a=='tog'){S.sel[id]?delete S.sel[id]:S.sel[id]=1;sv()}
 else if(a=='plus'){S.sel[id]=(S.sel[id]||0)+1;sv()}
 else if(a=='min'){if(S.sel[id]>1)S.sel[id]--;else delete S.sel[id];sv()}
 else if(a=='del'){delete S.sel[id];sv()}
 else if(a=='delx'){S.extra.splice(+v,1);sv()}
 else if(a=='oma'){if(hasO()){S.oma=false;S.omac={}}else S.oma=true;sv()}
 else if(a=='omg'){S.oma=!S.oma;sv()}
 else if(a=='omc'){S.omac[S.cat]?delete S.omac[S.cat]:S.omac[S.cat]=1;sv()}
 else if(a=='read')S.v='rintro';
 else if(a=='rstart')return step(0);
 else if(a=='rstop'){try{speechSynthesis.cancel()}catch(e){}S.v='home'}
 else if(a=='rrep'){const r=R[S.rd];return say(r.it.n)}
 else if(a=='rno'){const it=R[S.rd].it;if(!it.col)delete S.sel[it.id];sv();return step(S.rd+1)}
 else if(a=='ryes'){const it=R[S.rd].it;if(it.col){S.sel[it.id]=(S.sel[it.id]||0)+1;sv();say((S.sel[it.id])+' keer '+it.n)}else{S.sel[it.id]=1;sv();return step(S.rd+1)}}
 else if(a=='send')return send(build(),true);
 else if(a=='retry')return send(...S.pend);
 else if(a=='resend'){const A=JSON.parse(ls('ar')||'[]');return send(A[+v],false)}
 else if(a=='addx'){const x=document.getElementById('x').value.trim();if(x){S.extra.push(x);sv();S.v='list'}}
 else if(a=='saveha'){ls('ha',document.getElementById('ha').value.trim())}
 render()}
let dn=null;
document.addEventListener('pointerdown',e=>{dn=[e.clientX,e.clientY]});
document.addEventListener('pointercancel',()=>{dn=null});
document.addEventListener('pointerup',e=>{if(!dn)return;const m=Math.hypot(e.clientX-dn[0],e.clientY-dn[1]);dn=null;if(m>14)return;const el=e.target.closest('[data-a]');if(el)act(el.dataset.a,el.dataset.v)});
document.addEventListener('contextmenu',e=>e.preventDefault());
try{speechSynthesis.getVoices()}catch(e){}
document.addEventListener('visibilitychange',()=>{if(document.hidden){try{speechSynthesis.cancel()}catch(e){}}else if(C.length&&S.v!='sending'){S.v='home';render()}});
fetch('artikelen.txt?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.text()}).then(t=>{C=parse(t);if(!C.length)throw 0;const ids=new Set();C.forEach((c,ci)=>c.it.forEach((it,k)=>{ids.add(it.id);R.push({it,ci,first:!k})}));for(const k in S.sel)if(!ids.has(k))delete S.sel[k];for(const k in S.omac)if(!C[k])delete S.omac[k];render()}).catch(()=>{document.getElementById('app').innerHTML='<p class="note" style="font-size:30px">De lijst met artikelen (artikelen.txt) kon niet geladen worden. Controleer het internet en ververs de pagina.</p>'});
</script></body></html>
